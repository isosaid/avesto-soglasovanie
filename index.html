<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <b>Бюджети сармоягузорӣ</b>
      <span>ҶДММ «Авесто Гуруҳ» · согласование заявок на оплату</span>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-tab="requests" aria-selected="true">Дархостҳо</button>
      <button type="button" role="tab" data-tab="contracts" aria-selected="false">Шартномаҳо</button>
    </nav>
    <div class="tools">
      <button type="button" id="importBtn" title="Загрузить реестр из файла Excel">Импорт</button>
      <button type="button" id="exportBtn" title="Выгрузить реестр в Excel в формате «Мархилаи-2»">Экспорт</button>
      <button type="button" id="reloadBtn" title="Навсозӣ · обновить данные">↻</button>
      <button type="button" id="meBtn" title="Войти как подписант">Даромад · войти</button>
    </div>
    <input type="file" id="xlsxInput" accept=".xlsx,.xlsm,.xls" hidden>
  </div>
</header>

<main class="wrap">
  <div id="view"></div>
</main>

<footer class="site">
  <div class="wrap">
    <span id="footText">Разработано Отделом автоматизации холдинга ООО «Авесто Групп» · ISJ</span>
  </div>
</footer>

<div id="modalHost"></div>
<div id="toastHost"></div>
